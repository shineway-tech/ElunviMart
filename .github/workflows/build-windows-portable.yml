name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows portable package
        run: pnpm run package:win

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Elunvi-Mart-1.0.0-windows-portable
          path: release/Elunvi-Mart-1.0.0-portable.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Elunvi Mart v1.0.0
          body: Windows x64 免安装版
          draft: false
          prerelease: false
          files: release/Elunvi-Mart-1.0.0-portable.exe
          fail_on_unmatched_files: true
